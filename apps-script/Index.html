<!doctype html>
<html lang="vi">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
:root {
  --bg: #f4f6fb;
  --card: #ffffff;
  --text: #1f2937;
  --muted: #6b7280;
  --border: #e5e7eb;
  --primary: #2563eb;
  --primary-dark: #1d4ed8;
  --green: #16a34a;
  --green-bg: #dcfce7;
  --red: #dc2626;
  --red-bg: #fee2e2;
  --amber: #d97706;
  --amber-bg: #fef3c7;
  --radius: 12px;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: "Segoe UI", Roboto, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
}

button { font: inherit; cursor: pointer; }

.site-header {
  background: var(--card);
  padding: 18px 24px 14px;
  border-bottom: 1px solid var(--border);
}
.hdr-khoa {
  font-size: 34px;
  font-weight: 800;
  color: var(--primary-dark);
  letter-spacing: 1px;
  line-height: 1.1;
}
.hdr-title {
  margin-top: 16px;
  text-align: center;
  font-size: 22px;
  font-weight: 700;
}
.hdr-note {
  margin-top: 8px;
  text-align: left;
  font-size: 14px;
  font-style: italic;
  color: var(--muted);
}
@media (max-width: 600px) {
  .hdr-khoa { font-size: 28px; }
  .hdr-title { font-size: 17px; }
}

.toolbar {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 8px 20px;
  background: #f8fafc;
  border-bottom: 1px solid var(--border);
  min-height: 52px;
}
.topbar-right { display: flex; align-items: center; gap: 10px; }

.timer {
  font-variant-numeric: tabular-nums;
  font-weight: 700;
  font-size: 18px;
  padding: 4px 12px;
  border-radius: 8px;
  background: #eef2ff;
  color: var(--primary-dark);
}
.timer.warning { background: var(--red-bg); color: var(--red); }

main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
}

h1 { font-size: 26px; margin: 0 0 6px; }
h2 { font-size: 20px; margin: 0 0 12px; }
.muted { color: var(--muted); }

/* ---------- Trang chủ ---------- */
.modes {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 20px;
  margin-top: 24px;
}
.mode-card { display: flex; flex-direction: column; gap: 12px; }
.mode-card .icon { font-size: 36px; }
.mode-card ul { margin: 0; padding-left: 20px; color: var(--muted); }
.mode-card .actions { margin-top: auto; display: flex; flex-wrap: wrap; gap: 10px; }

.btn {
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  padding: 10px 18px;
  border-radius: 8px;
  font-weight: 600;
}
.btn:hover { background: #f3f4f6; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn.primary:hover { background: var(--primary-dark); }
.btn.danger { color: var(--red); border-color: #fecaca; }
.btn.danger:hover { background: var(--red-bg); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.small { padding: 6px 12px; font-size: 14px; }

.progress {
  height: 8px;
  background: var(--border);
  border-radius: 99px;
  overflow: hidden;
}
.progress > div { height: 100%; background: var(--primary); }

/* ---------- Màn hình làm bài ---------- */
.quiz-layout {
  display: grid;
  grid-template-columns: 1fr 300px;
  gap: 20px;
  align-items: start;
}
@media (max-width: 860px) {
  .quiz-layout { grid-template-columns: 1fr; }
}

.q-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}
.q-number { font-weight: 700; color: var(--primary); }
.q-text { font-size: 18px; white-space: pre-wrap; margin: 0 0 18px; }

.options { display: flex; flex-direction: column; gap: 10px; }
.option {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  text-align: left;
  width: 100%;
  padding: 12px 14px;
  border: 2px solid var(--border);
  border-radius: 10px;
  background: var(--card);
  color: var(--text);
}
.option:hover:not(:disabled) { border-color: var(--primary); background: #f8faff; }
.option .letter {
  flex: 0 0 30px;
  height: 30px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: #f3f4f6;
  font-weight: 700;
}
.option .opt-text { white-space: pre-wrap; padding-top: 3px; }
.option.selected { border-color: var(--primary); background: #eef2ff; }
.option.selected .letter { background: var(--primary); color: #fff; }
.option.correct { border-color: var(--green); background: var(--green-bg); }
.option.correct .letter { background: var(--green); color: #fff; }
.option.wrong { border-color: var(--red); background: var(--red-bg); }
.option.wrong .letter { background: var(--red); color: #fff; }
.option:disabled { cursor: default; }

.explain {
  margin-top: 18px;
  padding: 14px 16px;
  border-radius: 10px;
  background: var(--amber-bg);
  border-left: 4px solid var(--amber);
  white-space: pre-wrap;
}
.verdict { font-weight: 700; margin-top: 16px; }
.verdict.ok { color: var(--green); }
.verdict.no { color: var(--red); }

.nav-buttons {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-top: 22px;
}

.side { position: sticky; top: 64px; display: flex; flex-direction: column; gap: 14px; }
.side .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 14px; }
.side .stats b { font-size: 18px; display: block; }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(38px, 1fr));
  gap: 6px;
  max-height: 340px;
  overflow-y: auto;
  padding: 2px;
}
.cell {
  position: relative;
  height: 36px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--card);
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
}
.cell.answered { background: #dbeafe; border-color: #93c5fd; }
.cell.correct { background: var(--green-bg); border-color: #86efac; color: var(--green); }
.cell.wrong { background: var(--red-bg); border-color: #fca5a5; color: var(--red); }
.cell.current { outline: 2px solid var(--primary); outline-offset: 1px; }
.cell.flagged::after {
  content: "";
  position: absolute;
  top: 2px; right: 2px;
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--amber);
}

.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--muted); }
.legend span::before {
  content: "";
  display: inline-block;
  width: 10px; height: 10px;
  margin-right: 4px;
  border-radius: 3px;
  vertical-align: -1px;
  background: var(--c);
  border: 1px solid #d1d5db;
}

/* ---------- Kết quả ---------- */
.result-summary {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 14px;
  margin: 20px 0;
}
.stat-box {
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px;
  text-align: center;
}
.stat-box b { display: block; font-size: 26px; }

.review-item { border-top: 1px solid var(--border); padding: 18px 0; }
.review-item:first-child { border-top: 0; }
.filter-bar { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 6px; }
.filter-bar .btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

/* ---------- Hộp thoại ---------- */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, .45);
  display: grid;
  place-items: center;
  z-index: 50;
  padding: 16px;
}
.modal { max-width: 440px; width: 100%; }
.modal .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }

.q-stem p { margin: 0 0 10px; white-space: pre-wrap; }
.q-stem p:last-child { font-weight: 600; margin-bottom: 16px; }
.explain p { margin: 0 0 6px; }
.explain p:last-child { margin-bottom: 0; }
.explain { white-space: normal; }
.explain p { white-space: pre-wrap; }
.q-meta { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.cell:disabled { cursor: default; }

/* ---------- Bảng ---------- */
.table-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th, .tbl td { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: center; }
.tbl th { background: #f8fafc; font-weight: 600; }
.tbl td:first-child, .tbl th:first-child { text-align: left; }
.tbl tr.sub td:first-child { padding-left: 28px; color: var(--muted); }
.tbl tr.total td { font-weight: 700; }
.bar { position: relative; height: 8px; background: var(--border); border-radius: 99px; min-width: 80px; }
.bar > div { position: absolute; inset: 0 auto 0 0; border-radius: 99px; }
.lvl { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.lvl.y { background: var(--red-bg); color: var(--red); }
.lvl.tb { background: var(--amber-bg); color: var(--amber); }
.lvl.k { background: #dbeafe; color: var(--primary-dark); }
.lvl.t { background: var(--green-bg); color: var(--green); }
.lvl.na { background: #f3f4f6; color: var(--muted); }
.alert { padding: 12px 16px; border-radius: 10px; margin: 12px 0; }
.alert.warn { background: var(--red-bg); border-left: 4px solid var(--red); }
.alert.ok { background: var(--green-bg); border-left: 4px solid var(--green); }
details.card summary { cursor: pointer; font-weight: 600; }
details.card[open] summary { margin-bottom: 12px; }
.two-col { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
.explain .ex-head { margin-top: 10px; }
.explain .ex-opt { padding-left: 4px; }
.loading { position: fixed; inset: 0; background: rgba(255,255,255,.55); display: none; place-items: center; z-index: 60; }
.loading.show { display: grid; }
.spinner { width: 42px; height: 42px; border: 4px solid #dbeafe; border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.save-state { font-size: 13px; color: var(--muted); }
.user-email { font-size: 13px; color: var(--muted); }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="hdr-khoa">KHOA Y</div>
    <div class="hdr-title">CHUẨN BỊ CHO KỲ THI ĐÁNH GIÁ NĂNG LỰC QUỐC GIA</div>
    <div class="hdr-note">Lưu ý: Nội dung chỉ mang tính chất tham khảo</div>
  </header>

  <nav class="toolbar">
    <button class="btn small" id="homeBtn">🏠 Trang chủ</button>
    <div class="topbar-right" id="topbarRight"></div>
  </nav>

  <main id="app"></main>
  <div class="loading" id="loading"><div class="spinner"></div></div>

<script>
(function () {
  "use strict";

  const app = document.getElementById("app");
  const topRight = document.getElementById("topbarRight");
  const loadingEl = document.getElementById("loading");
  const LETTERS = "ABCD";
  let HOME = null;          // dữ liệu trang chủ (cấu hình, trọng số, trạng thái)
  let timerHandle = null, keyHandler = null, saveHandle = null;

  /* ---------- Gọi máy chủ (tự thử lại khi máy chủ bận) ---------- */
  let pending = 0;
  function busy(on) {
    pending += on ? 1 : -1;
    loadingEl.classList.toggle("show", pending > 0);
  }
  function call(name, ...args) {
    return new Promise((resolve, reject) => {
      let tries = 0;
      const run = () => {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler((err) => {
            const msg = String((err && err.message) || err);
            if (++tries < 4 && /too many|simultaneous|timed out|try again|Service|quá nhiều|NetworkError/i.test(msg)) {
              setTimeout(run, 700 * tries + Math.random() * 800);
            } else reject(new Error(msg));
          })[name](...args);
      };
      run();
    });
  }
  async function api(name, ...args) {
    busy(true);
    try { return await call(name, ...args); }
    catch (e) { showError(e.message); throw e; }
    finally { busy(false); }
  }
  function showError(msg) {
    const backdrop = el("div", { class: "modal-backdrop" });
    backdrop.append(el("div", { class: "card modal" },
      el("p", { style: "margin-top:0;white-space:pre-wrap", text: "⚠️ " + msg }),
      el("div", { class: "actions" }, el("button", { class: "btn primary", onclick: () => backdrop.remove() }, "Đóng"))));
    document.body.append(backdrop);
  }

  /* ---------- Tiện ích ---------- */
  function el(tag, attrs, ...children) {
    const node = document.createElement(tag);
    if (attrs) {
      for (const [k, v] of Object.entries(attrs)) {
        if (v == null || v === false) continue;
        if (k === "class") node.className = v;
        else if (k === "text") node.textContent = v;
        else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
        else if (k === "style") node.style.cssText = v;
        else node.setAttribute(k, v === true ? "" : v);
      }
    }
    for (const c of children.flat(Infinity)) {
      if (c == null || c === false) continue;
      node.append(c instanceof Node ? c : document.createTextNode(String(c)));
    }
    return node;
  }
  function fmtTime(ms) {
    const s = Math.max(0, Math.floor(ms / 1000));
    return [Math.floor(s / 3600), Math.floor((s % 3600) / 60), s % 60].map((x) => String(x).padStart(2, "0")).join(":");
  }
  const fmtDate = (ts) => new Date(ts).toLocaleString("vi-VN");
  const pct = (a, b) => (b ? Math.round((a / b) * 1000) / 10 : 0);
  function cleanup() {
    if (timerHandle) { clearInterval(timerHandle); timerHandle = null; }
    if (keyHandler) { document.removeEventListener("keydown", keyHandler); keyHandler = null; }
    topRight.innerHTML = "";
    window.onbeforeunload = null;
  }
  function confirmBox(message, okText, onOk) {
    const backdrop = el("div", { class: "modal-backdrop" });
    const close = () => backdrop.remove();
    backdrop.append(el("div", { class: "card modal" },
      el("p", { style: "margin-top:0;white-space:pre-wrap", text: message }),
      el("div", { class: "actions" },
        el("button", { class: "btn", onclick: close }, "Hủy"),
        el("button", { class: "btn primary", onclick: () => { close(); onOk(); } }, okText))));
    backdrop.addEventListener("click", (e) => { if (e.target === backdrop) close(); });
    document.body.append(backdrop);
  }
  function keyToIndex(key) {
    if (/^[1-4]$/.test(key)) return Number(key) - 1;
    return key.length === 1 ? LETTERS.indexOf(key.toUpperCase()) : -1;
  }
  const compName = (id) => (HOME.comps.find((c) => c.id === id) || {}).name || id;
  const subName = (c, s) => ((HOME.subs[c] || []).find((x) => x[0] === s) || [])[1] || s;

  /* ---------- Thành phần câu hỏi ---------- */
  function stemNode(q) {
    return el("div", { class: "q-stem" }, q.stem.map((t) => el("p", { text: t })));
  }
  function explainNode(answer, ex) {
    ex = ex || { r: "", d: {} };
    return el("div", { class: "explain" },
      el("p", null, el("b", { text: `Đáp án và lập luận: ${answer}. ` }), ex.r),
      el("p", { class: "ex-head" }, el("b", { text: "Vì sao không chọn các phương án khác:" })),
      Object.keys(ex.d || {}).sort().map((L) => el("p", { class: "ex-opt" }, el("b", { text: `${L}. ` }), ex.d[L])));
  }
  function optionNodes(q, o) {
    return el("div", { class: "options" }, q.options.map((text, i) => {
      const L = LETTERS[i];
      let cls = "option";
      if (o.answer) {
        if (L === o.answer) cls += " correct";
        else if (L === o.chosen) cls += " wrong";
      } else if (o.chosen === L) cls += " selected";
      return el("button", { class: cls, disabled: !!o.answer || !o.onPick, onclick: () => o.onPick && o.onPick(L) },
        el("span", { class: "letter", text: L }), el("span", { class: "opt-text", text }));
    }));
  }

  /* ---------- Trang chủ ---------- */
  async function renderHome() {
    cleanup();
    app.innerHTML = "";
    try { HOME = await api("api_home"); } catch (e) {
      app.append(el("div", { class: "card" }, el("h2", { text: "Không thể truy cập" }), el("p", { text: e.message })));
      return;
    }
    const H = HOME;
    topRight.append(el("span", { class: "user-email", text: "👤 " + H.email }));
    const quotaText = (n) => (n == null ? null : el("p", { class: "muted", style: "font-size:13px;margin:0", text: `Còn ${n} lượt hôm nay.` }));

    const examActions = el("div", { class: "actions" });
    let examNote = null;
    if (H.exam.status === "running") {
      examNote = el("p", { class: "muted" }, "Bạn đang có bài thi dở, còn ", el("b", { text: fmtTime(H.exam.leftMs) }), ".");
      examActions.append(el("button", { class: "btn primary", onclick: () => openExam(false) }, "Tiếp tục bài thi"));
    } else {
      examActions.append(el("button", { class: "btn primary", onclick: () => openExam(true) }, "Bắt đầu thi"));
      if (H.exam.status === "done") {
        examNote = el("p", { class: "muted" }, "Lần thi gần nhất: ",
          el("b", { text: `${H.exam.result.correct}/${H.exam.result.total}` }), ` câu đúng (${fmtDate(H.exam.result.finishedAt)}).`);
        examActions.append(el("button", { class: "btn", onclick: () => showReview("exam") }, "Xem kết quả & phân tích"));
      }
    }

    const practiceActions = el("div", { class: "actions" });
    let practiceNote = null;
    if (H.practice.status === "running") {
      practiceNote = el("div", null,
        el("p", { class: "muted", style: "margin:0 0 6px", text: `Đợt luyện tập đang làm: ${H.practice.done}/${H.practice.total} câu.` }),
        el("div", { class: "progress" }, el("div", { style: `width:${pct(H.practice.done, H.practice.total)}%` })));
      practiceActions.append(
        el("button", { class: "btn primary", onclick: () => openPractice(false) }, "Tiếp tục luyện tập"),
        el("button", { class: "btn danger", onclick: () => confirmBox("Bỏ đợt luyện tập đang làm và tạo đề mới?", "Tạo đề mới", () => openPractice(true)) }, "Làm đề mới"));
    } else {
      practiceActions.append(el("button", { class: "btn primary", onclick: () => openPractice(true) }, "Bắt đầu luyện tập"));
      if (H.practice.status === "done") {
        practiceActions.append(el("button", { class: "btn", onclick: () => showReview("practice") }, "Xem kết quả & phân tích"));
      }
    }

    app.append(
      el("p", { class: "muted", text: `Ngân hàng hiện có ${H.bankSize} câu hỏi thuộc ${H.systems.length} hệ cơ quan. Câu hỏi của mỗi đề được chọn theo tỉ lệ hệ cơ quan và miền năng lực của Quyết định 22/QĐ-HĐYKQG.` }),
      el("div", { class: "modes" },
        el("div", { class: "card mode-card" },
          el("div", { class: "icon", text: "⏱️" }),
          el("h2", { text: "Real-time (thi thử)" }),
          el("ul", null,
            el("li", { text: `${H.cfg.examTotal} câu hỏi, thời gian ${H.cfg.minutes / 60} tiếng` }),
            el("li", { text: "Hết giờ hệ thống tự động nộp bài" }),
            el("li", { text: "Đáp án và giải thích chỉ hiện sau khi hoàn thành bài thi" })),
          examNote, quotaText(H.quota.exam), examActions),
        el("div", { class: "card mode-card" },
          el("div", { class: "icon", text: "📝" }),
          el("h2", { text: "Practice (luyện tập)" }),
          el("ul", null,
            el("li", { text: `${H.cfg.practiceTotal} câu hỏi mỗi đợt, không giới hạn thời gian` }),
            el("li", { text: "Bấm Nộp để xem ngay đáp án và giải thích của từng câu" }),
            el("li", { text: "Không quay lại câu trước; tiến độ được lưu trên máy chủ" })),
          practiceNote, quotaText(H.quota.practice), practiceActions)),
      blueprintNode());
  }

  function blueprintNode() {
    const H = HOME;
    const table = (head, items, a, b) => el("div", { class: "table-wrap" }, el("table", { class: "tbl" },
      el("thead", null, el("tr", null, el("th", { text: head }), el("th", { text: "Trọng số QĐ 22" }),
        el("th", { text: `Real-time (${H.cfg.examTotal} câu)` }), el("th", { text: `Practice (${H.cfg.practiceTotal} câu)` }))),
      el("tbody", null,
        items.map((it, i) => el("tr", null, el("td", { text: it.name }), el("td", { text: `${it.min}–${it.max}%` }), el("td", { text: a[i] }), el("td", { text: b[i] }))),
        el("tr", { class: "total" }, el("td", { text: "Tổng" }), el("td"), el("td", { text: H.cfg.examTotal }), el("td", { text: H.cfg.practiceTotal })))));
    return el("details", { class: "card", style: "margin-top:20px" },
      el("summary", { text: "Cấu trúc đề theo Quyết định 22/QĐ-HĐYKQG" }),
      el("div", { class: "two-col" },
        table("Hệ cơ quan / đề mục", H.systems, H.plan.examSys, H.plan.practiceSys),
        table("Miền năng lực", H.comps, H.plan.examComp, H.plan.practiceComp)),
      el("p", { class: "muted", style: "font-size:13px;margin-bottom:0",
        text: `Đề ${H.cfg.practiceTotal} câu quá ngắn để mọi mục nằm trọn trong khoảng trọng số: mỗi mục có ít nhất 1 câu, số câu được làm tròn gần nhất với trọng số trung bình.` }));
  }

  /* ---------- Real-time ---------- */
  async function openExam(isNew) {
    let data;
    try { data = await api(isNew ? "api_startExam" : "api_getExam"); } catch (e) { return; }
    if (data.finished) return showReview("exam");
    if (data.items) return renderReview(data);  // hết giờ khi đang rời trang
    runExam(data);
  }

  function runExam(data) {
    cleanup();
    const st = {
      qs: data.questions, answers: data.answers || {}, flags: data.flags || {},
      current: Math.min(data.current || 0, data.questions.length - 1),
      endAt: data.endAt, offset: data.now - Date.now(), submitting: false
    };
    const now = () => Date.now() + st.offset;
    const saveState = el("span", { class: "save-state" });
    const timer = el("span", { class: "timer" });
    topRight.append(saveState, timer);

    function scheduleSave() {
      saveState.textContent = "Đang lưu…";
      clearTimeout(saveHandle);
      saveHandle = setTimeout(async () => {
        try {
          const r = await call("api_saveExam", st.answers, st.flags, st.current);
          saveState.textContent = r && r.ok ? "✓ Đã lưu" : "";
        } catch (e) { saveState.textContent = "⚠️ Chưa lưu được, sẽ thử lại"; scheduleSave(); }
      }, 1500);
    }
    async function submit(timeout) {
      if (st.submitting) return;
      st.submitting = true;
      clearTimeout(saveHandle);
      cleanup();
      try {
        const review = await api("api_submitExam", st.answers, st.flags, st.current);
        renderReview(review);
        if (timeout) setTimeout(() => showError("Đã hết giờ làm bài. Hệ thống đã tự động nộp bài."), 50);
      } catch (e) { st.submitting = false; runExam({ questions: st.qs, answers: st.answers, flags: st.flags, current: st.current, endAt: st.endAt, now: now() }); }
    }
    const tick = () => {
      const left = st.endAt - now();
      timer.textContent = "⏳ " + fmtTime(left);
      timer.classList.toggle("warning", left <= 10 * 60 * 1000);
      if (left <= 0) submit(true);
    };
    tick();
    timerHandle = setInterval(tick, 1000);
    window.onbeforeunload = () => true;

    function go(i) {
      if (i < 0 || i >= st.qs.length) return;
      st.current = i; draw(); scheduleSave(); window.scrollTo({ top: 0 });
    }
    function pick(L) {
      const id = st.qs[st.current].id;
      if (st.answers[id] === L) delete st.answers[id]; else st.answers[id] = L;
      draw(); scheduleSave();
    }
    function draw() {
      const q = st.qs[st.current];
      const answered = st.qs.filter((x) => st.answers[x.id]).length;
      app.innerHTML = "";
      app.append(el("div", { class: "quiz-layout" },
        el("div", { class: "card" },
          el("div", { class: "q-head" },
            el("span", { class: "q-number", text: `Câu ${st.current + 1}/${st.qs.length}` }),
            el("button", { class: "btn small", onclick: () => { st.flags[q.id] = !st.flags[q.id]; draw(); scheduleSave(); } },
              st.flags[q.id] ? "🚩 Bỏ đánh dấu" : "🏳️ Đánh dấu xem lại")),
          stemNode(q),
          optionNodes(q, { chosen: st.answers[q.id], onPick: pick }),
          el("div", { class: "nav-buttons" },
            el("button", { class: "btn", disabled: st.current === 0, onclick: () => go(st.current - 1) }, "← Câu trước"),
            el("button", { class: "btn", disabled: st.current === st.qs.length - 1, onclick: () => go(st.current + 1) }, "Câu sau →"))),
        el("div", { class: "side" },
          el("div", { class: "card" },
            el("div", { class: "stats" },
              el("div", null, el("b", { text: answered }), "Đã làm"),
              el("div", null, el("b", { text: st.qs.length - answered }), "Chưa làm")),
            el("div", { class: "progress", style: "margin-top:10px" }, el("div", { style: `width:${pct(answered, st.qs.length)}%` }))),
          el("div", { class: "card" },
            el("div", { class: "grid" }, st.qs.map((x, i) => el("button", {
              class: "cell" + (st.answers[x.id] ? " answered" : "") + (st.flags[x.id] ? " flagged" : "") + (i === st.current ? " current" : ""),
              onclick: () => go(i)
            }, i + 1))),
            el("div", { class: "legend", style: "margin-top:10px" },
              el("span", { style: "--c:#dbeafe", text: "Đã làm" }),
              el("span", { style: "--c:#fff", text: "Chưa làm" }),
              el("span", { style: "--c:#d97706", text: "Đánh dấu" }))),
          el("button", { class: "btn primary", onclick: () => {
            const left = st.qs.length - answered;
            confirmBox(left > 0 ? `Bạn còn ${left} câu chưa làm. Bạn chắc chắn muốn nộp bài?` : "Bạn chắc chắn muốn nộp bài?", "Nộp bài", () => submit(false));
          } }, "Nộp bài"),
          el("button", { class: "btn", onclick: async () => {
            clearTimeout(saveHandle);
            try { await api("api_saveExam", st.answers, st.flags, st.current); } catch (e) { return; }
            renderHome();
          } }, "Tạm rời (thời gian vẫn chạy)"))));
    }
    keyHandler = (e) => {
      if (document.querySelector(".modal-backdrop")) return;
      if (e.key === "ArrowRight") go(st.current + 1);
      else if (e.key === "ArrowLeft") go(st.current - 1);
      else {
        const i = keyToIndex(e.key);
        const q = st.qs[st.current];
        if (i >= 0 && i < q.options.length) { st.answers[q.id] = LETTERS[i]; draw(); scheduleSave(); }
      }
    };
    document.addEventListener("keydown", keyHandler);
    draw();
  }

  /* ---------- Practice ---------- */
  async function openPractice(isNew) {
    let v;
    try { v = await api(isNew ? "api_startPractice" : "api_getPractice"); } catch (e) { return; }
    if (v.finished) return showReview("practice");
    runPractice(v);
  }

  function runPractice(v) {
    cleanup();
    topRight.append(el("span", { class: "save-state", text: "💾 Tiến độ lưu trên máy chủ" }));
    let chosen = v.chosen || null;

    async function submit() {
      if (!chosen || v.answer) return;
      try { v = await api("api_submitPractice", v.index, chosen); } catch (e) { return; }
      chosen = v.chosen; draw();
    }
    async function next() {
      if (!v.answer) return;
      let r;
      try { r = await api("api_nextPractice"); } catch (e) { return; }
      if (r.finished) { cleanup(); return renderReview(r.review); }
      v = r; chosen = null; draw(); window.scrollTo({ top: 0 });
    }
    async function finish() {
      let r;
      try { r = await api("api_finishPractice"); } catch (e) { return; }
      cleanup(); renderReview(r.review);
    }

    function draw() {
      const q = v.question;
      const done = !!v.answer;
      const correct = v.statuses.filter((s) => s === "c").length;
      const wrong = v.statuses.filter((s) => s === "w").length;
      const isLast = v.index === v.total - 1;
      app.innerHTML = "";
      app.append(el("div", { class: "quiz-layout" },
        el("div", { class: "card" },
          el("div", { class: "q-head" }, el("span", { class: "q-number", text: `Câu ${v.index + 1}/${v.total}` })),
          stemNode(q),
          optionNodes(q, { chosen, answer: v.answer, onPick: done ? null : (L) => { chosen = L; draw(); } }),
          done ? [
            el("div", { class: "verdict " + (chosen === v.answer ? "ok" : "no"),
              text: chosen === v.answer ? "✔ Chính xác!" : `✘ Chưa đúng. Đáp án đúng là ${v.answer}.` }),
            explainNode(v.answer, v.ex)
          ] : null,
          el("div", { class: "nav-buttons", style: "justify-content:flex-end" },
            done
              ? el("button", { class: "btn primary", onclick: next }, isLast ? "Hoàn thành & xem phân tích" : "Câu tiếp theo →")
              : el("button", { class: "btn primary", disabled: !chosen, onclick: submit }, "Nộp"))),
        el("div", { class: "side" },
          el("div", { class: "card" },
            el("div", { class: "stats" },
              el("div", { style: "color:var(--green)" }, el("b", { text: correct }), "Đúng"),
              el("div", { style: "color:var(--red)" }, el("b", { text: wrong }), "Sai"),
              el("div", null, el("b", { text: v.total - correct - wrong }), "Chưa làm"),
              el("div", null, el("b", { text: Math.round(pct(correct + wrong, v.total)) + "%" }), "Hoàn thành")),
            el("div", { class: "progress", style: "margin-top:10px" }, el("div", { style: `width:${pct(correct + wrong, v.total)}%` }))),
          el("div", { class: "card" },
            el("div", { class: "grid" }, v.statuses.map((s, i) => el("button", {
              class: "cell" + (s === "c" ? " correct" : s === "w" ? " wrong" : "") + (i === v.index ? " current" : ""), disabled: true
            }, i + 1))),
            el("div", { class: "legend", style: "margin-top:10px" },
              el("span", { style: "--c:#dcfce7", text: "Đúng" }),
              el("span", { style: "--c:#fee2e2", text: "Sai" }),
              el("span", { style: "--c:#fff", text: "Chưa làm" }))),
          el("button", { class: "btn", onclick: () => confirmBox("Kết thúc đợt luyện tập này và xem bảng phân tích?\n(Các câu chưa làm sẽ không được tính.)", "Kết thúc", finish) }, "🏁 Kết thúc đợt luyện tập"),
          el("button", { class: "btn", onclick: renderHome }, "💾 Lưu và thoát"))));
    }
    keyHandler = (e) => {
      if (document.querySelector(".modal-backdrop") || pending) return;
      if (e.key === "Enter") { v.answer ? next() : submit(); return; }
      const i = keyToIndex(e.key);
      if (!v.answer && i >= 0 && i < v.question.options.length) { chosen = LETTERS[i]; draw(); }
    };
    document.addEventListener("keydown", keyHandler);
    draw();
  }

  /* ---------- Phân tích năng lực ---------- */
  function level(rate, denom) {
    if (!denom) return el("span", { class: "lvl na", text: "Chưa có dữ liệu" });
    if (rate < 50) return el("span", { class: "lvl y", text: "Yếu" });
    if (rate < 65) return el("span", { class: "lvl tb", text: "Trung bình" });
    if (rate < 80) return el("span", { class: "lvl k", text: "Khá" });
    return el("span", { class: "lvl t", text: "Tốt" });
  }
  function barNode(rate, denom) {
    const color = !denom ? "#d1d5db" : rate < 50 ? "var(--red)" : rate < 65 ? "var(--amber)" : rate < 80 ? "var(--primary)" : "var(--green)";
    return el("div", { class: "bar" }, el("div", { style: `width:${rate}%;background:${color}` }));
  }
  function analysisNode(review) {
    const mode = review.mode;
    const dom = {}, sub = {};
    const empty = () => ({ n: 0, correct: 0, wrong: 0, blank: 0 });
    review.items.forEach((q) => {
      [[dom, q.c], [sub, q.c + "/" + q.s]].forEach(([obj, key]) => {
        const r = obj[key] = obj[key] || empty();
        r.n++; r[q.status]++;
      });
    });
    const fin = (r) => { r.denom = mode === "exam" ? r.n : r.correct + r.wrong; r.rate = pct(r.correct, r.denom); return r; };
    Object.values(dom).forEach(fin); Object.values(sub).forEach(fin);

    const row = (name, r, cls) => el("tr", { class: cls },
      el("td", { text: name }), el("td", { text: r.n }),
      el("td", { style: "color:var(--green)", text: r.correct }), el("td", { style: "color:var(--red)", text: r.wrong }),
      el("td", { text: r.blank }), el("td", null, r.denom ? r.rate + "%" : "–"),
      el("td", null, barNode(r.rate, r.denom)), el("td", null, level(r.rate, r.denom)));
    const rows = [], tot = empty();
    HOME.comps.forEach((c) => {
      const r = dom[c.id] || fin(empty());
      ["n", "correct", "wrong", "blank"].forEach((k) => { tot[k] += r[k]; });
      rows.push(row(c.name, r, ""));
      const subs = HOME.subs[c.id] || [];
      if (subs.length > 1) subs.forEach(([sid, sname]) => rows.push(row(sname, sub[c.id + "/" + sid] || fin(empty()), "sub")));
    });
    rows.push(row("Tổng", fin(tot), "total"));

    const ranked = HOME.comps.map((c) => ({ c, r: dom[c.id] })).filter((x) => x.r && x.r.denom > 0).sort((a, b) => a.r.rate - b.r.rate);
    const weak = ranked.filter((x) => x.r.rate < 65);
    const weakSubs = HOME.comps.filter((c) => (HOME.subs[c.id] || []).length > 1)
      .flatMap((c) => HOME.subs[c.id].map(([sid, sname]) => ({ name: sname, r: sub[c.id + "/" + sid] })))
      .filter((x) => x.r && x.r.denom > 0 && x.r.rate < 65).sort((a, b) => a.r.rate - b.r.rate);
    let summary;
    if (!ranked.length) summary = el("div", { class: "alert warn", text: "Chưa có câu nào được làm để phân tích." });
    else if (weak.length) summary = el("div", { class: "alert warn" },
      el("b", { text: "Miền năng lực cần cải thiện: " }),
      weak.map((x, i) => [i ? "; " : "", el("b", { text: x.c.name }), ` (${x.r.rate}%)`]),
      weakSubs.length ? el("div", { style: "margin-top:6px" }, "Tiểu mục yếu: ", weakSubs.map((x, i) => `${i ? "; " : ""}${x.name} (${x.r.rate}%)`)) : null);
    else summary = el("div", { class: "alert ok" }, "Không có miền năng lực nào dưới 65%. Miền có kết quả thấp nhất: ",
      el("b", { text: ranked[0].c.name }), ` (${ranked[0].r.rate}%).`);

    return el("div", null,
      el("h2", { style: "margin-top:24px", text: "Phân tích theo miền năng lực" }),
      summary,
      el("div", { class: "table-wrap" }, el("table", { class: "tbl" },
        el("thead", null, el("tr", null, ["Miền / tiểu mục năng lực", "Số câu", "Đúng", "Sai", "Bỏ trống", "Tỉ lệ đúng", "", "Đánh giá"].map((t) => el("th", { text: t })))),
        el("tbody", null, rows))),
      el("p", { class: "muted", style: "font-size:13px" },
        mode === "exam" ? "Tỉ lệ đúng = số câu đúng / số câu của miền (câu bỏ trống tính là chưa đạt). " : "Tỉ lệ đúng = số câu đúng / số câu đã làm của miền. ",
        "Mức đánh giá: Yếu < 50% · Trung bình 50–64% · Khá 65–79% · Tốt ≥ 80%. Miền có ít câu (1–3 câu) chỉ mang tính tham khảo."));
  }

  /* ---------- Kết quả ---------- */
  async function showReview(mode) {
    let r;
    try { r = await api("api_review", mode); } catch (e) { return; }
    renderReview(r);
  }

  async function renderReview(review) {
    cleanup();
    if (!HOME) { try { HOME = await api("api_home"); } catch (e) { return; } }
    const mode = review.mode, items = review.items, res = review.result || {};
    const counts = { correct: 0, wrong: 0, blank: 0 };
    items.forEach((q) => counts[q.status]++);
    const total = items.length;

    let filter = "all";
    const list = el("div");
    const filterBar = el("div", { class: "filter-bar" });
    const compFilter = el("select", { class: "btn small", onchange: () => drawList() },
      el("option", { value: "", text: "Tất cả miền năng lực" }),
      HOME.comps.map((c) => el("option", { value: c.id, text: c.name })));
    const filters = [["all", `Tất cả (${total})`], ["wrong", `Sai (${counts.wrong})`],
      ["blank", `${mode === "exam" ? "Bỏ trống" : "Chưa làm"} (${counts.blank})`], ["correct", `Đúng (${counts.correct})`]];
    function drawFilters() {
      filterBar.innerHTML = "";
      filters.forEach(([k, label]) => filterBar.append(el("button", {
        class: "btn small" + (filter === k ? " active" : ""), onclick: () => { filter = k; drawFilters(); drawList(); }
      }, label)));
      filterBar.append(compFilter);
    }
    function drawList() {
      list.innerHTML = "";
      let shown = 0;
      items.forEach((q, idx) => {
        if (filter !== "all" && filter !== q.status) return;
        if (compFilter.value && q.c !== compFilter.value) return;
        shown++;
        const subs = HOME.subs[q.c] || [];
        list.append(el("div", { class: "review-item" },
          el("div", { class: "q-head" },
            el("span", { class: "q-number", text: `Câu ${idx + 1}` }),
            el("span", { class: "verdict " + (q.status === "correct" ? "ok" : "no"), style: "margin:0",
              text: q.status === "correct" ? "✔ Đúng" : q.status === "wrong" ? `✘ Sai (chọn ${q.chosen})` : "— Chưa làm" })),
          el("div", { class: "q-meta" }, `Hệ: ${q.gName}`, q.pName ? ` · Vấn đề: ${q.pName}` : "",
            ` · Năng lực: ${compName(q.c)}${subs.length > 1 ? " – " + subName(q.c, q.s) : ""}`),
          stemNode(q),
          optionNodes(q, { chosen: q.status === "blank" ? null : q.chosen, answer: q.answer }),
          explainNode(q.answer, q.ex)));
      });
      if (!shown) list.append(el("p", { class: "muted", text: "Không có câu hỏi nào." }));
    }

    app.innerHTML = "";
    app.append(el("div", { class: "card" },
      el("h1", { text: mode === "exam" ? "Kết quả bài thi Real-time" : "Kết quả đợt luyện tập" }),
      el("p", { class: "muted", text: (res.timeout ? "Tự động nộp do hết giờ · " : "") + (res.finishedAt ? "Kết thúc lúc " + fmtDate(res.finishedAt) : "") }),
      el("div", { class: "result-summary" },
        el("div", { class: "stat-box" }, el("b", { text: (total ? (counts.correct / total) * 10 : 0).toFixed(2) }), "Điểm (thang 10)"),
        el("div", { class: "stat-box", style: "color:var(--green)" }, el("b", { text: counts.correct }), "Câu đúng"),
        el("div", { class: "stat-box", style: "color:var(--red)" }, el("b", { text: counts.wrong }), "Câu sai"),
        el("div", { class: "stat-box" }, el("b", { text: counts.blank }), mode === "exam" ? "Bỏ trống" : "Chưa làm"),
        mode === "exam" && res.usedMs != null ? el("div", { class: "stat-box" }, el("b", { text: fmtTime(res.usedMs) }), "Thời gian làm bài") : null),
      el("div", { class: "filter-bar", style: "margin-top:0" },
        el("button", { class: "btn", onclick: renderHome }, "🏠 Về trang chủ"),
        mode === "exam"
          ? el("button", { class: "btn primary", onclick: () => openExam(true) }, "Làm đề thi mới")
          : el("button", { class: "btn primary", onclick: () => openPractice(true) }, "Luyện tập đề mới")),
      analysisNode(review),
      el("h2", { style: "margin-top:28px", text: "Xem lại đáp án và giải thích" }),
      filterBar, list));
    drawFilters();
    drawList();
    window.scrollTo({ top: 0 });
  }

  document.getElementById("homeBtn").addEventListener("click", () => {
    if (topRight.querySelector(".timer")) {
      confirmBox("Bạn đang làm bài thi. Về trang chủ? (Thời gian vẫn tiếp tục chạy)", "Về trang chủ", async () => {
        document.querySelector(".side .btn:last-child").click();
      });
    } else renderHome();
  });

  renderHome();
})();
</script>
